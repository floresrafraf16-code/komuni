
name: komuni
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  flutter_web_plugins:
    sdk: flutter
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  image_picker: ^1.2.4
  firebase_storage: ^14.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/komuni_app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/komuni_app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/komuni_app_icon.png"
    background_color: "#071A14"
    theme_color: "#39D98A"

flutter_native_splash:
  color: "#071A14"
  image: assets/images/komuni_app_icon.png
  fullscreen: true

  android_12:
    color: "#071A14"
    image: assets/images/komuni_app_icon.png
